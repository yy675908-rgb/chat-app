name: Build Android APK

on:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.yy675908 .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: >-
          flutter analyze lib
          test/chat_message_test.dart
          test/settings_backup_test.dart

      - name: Test
        run: >-
          flutter test
          test/chat_message_test.dart
          test/settings_backup_test.dart

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: linjian-android-signing-v1

      - name: Create signing key on first build
        run: |
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Linjian,OU=Android,O=Linjian,L=Beijing,C=CN" \
              -keyalg RSA -keysize 2048 -validity 36500
          fi

      - name: Configure release signing
        run: dart run tool/configure_android_signing.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: character-chat-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
