name: Build Android APK

on:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --no-pub --platforms=android --org com.yy675908 .
          git clean -f -- test/widget_test.dart
          git restore pubspec.lock
          git restore android/app/src/main/AndroidManifest.xml
          git restore android/app/src/main/kotlin/com/yy675908/character_chat_app/MainActivity.kt
          git restore android/app/src/main/kotlin/com/yy675908/character_chat_app/ProactiveNotificationReceiver.kt
          git diff --exit-code -- pubspec.yaml analysis_options.yaml

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub lib test

      - name: Test
        run: flutter test --no-pub test

      - name: Restore stable Android signing key
        uses: actions/cache@v6
        with:
          path: /home/runner/.android/debug.keystore
          key: linjian-android-signing-v1

      - name: Create signing key on first build
        run: |
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Linjian,OU=Android,O=Linjian,L=Beijing,C=CN" \
              -keyalg RSA -keysize 2048 -validity 36500
          fi

      - name: Configure release signing
        run: dart run tool/configure_android_signing.dart

      - name: Build optimized ABI-specific release APKs
        run: >-
          flutter build apk
          --no-pub
          --release
          --split-per-abi

      - name: Prepare and audit APK
        shell: bash
        run: |
          set -euo pipefail

          source_apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          output_dir="build/distribution"
          app_version=$(awk '/^version:/ {print $2}' pubspec.yaml)
          app_semver="${app_version%%+*}"
          output_apk="$output_dir/linjian-arm64-v$app_semver.apk"

          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"

          apk_entries=$(unzip -Z1 "$output_apk")
          if printf '%s\n' "$apk_entries" \
            | grep -E '^lib/(armeabi-v7a|x86|x86_64)/' >/dev/null; then
            echo "Unexpected non-arm64 native library found in release APK" >&2
            exit 1
          fi
          if ! printf '%s\n' "$apk_entries" \
            | grep -Fx 'lib/arm64-v8a/libflutter.so' >/dev/null; then
            echo "Required arm64 Flutter runtime is missing from release APK" >&2
            exit 1
          fi

          apk_size=$(stat -c%s "$output_apk")
          max_size=$((25 * 1024 * 1024))
          if [ "$apk_size" -gt "$max_size" ]; then
            echo "APK is larger than 25 MiB: $apk_size bytes" >&2
            exit 1
          fi

          ls -lh "$output_apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: linjian-arm64-release
          path: build/distribution/linjian-arm64-v*.apk
          if-no-files-found: error
          retention-days: 30
