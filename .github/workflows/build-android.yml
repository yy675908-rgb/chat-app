name: Build Android APK

on:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependency lock
        run: |
          flutter create --no-pub --platforms=android --org com.yy675908 .
          flutter pub get
          echo '---PUBSPEC_LOCK_BEGIN---'
          cat pubspec.lock
          echo '---PUBSPEC_LOCK_END---'
