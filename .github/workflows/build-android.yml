name: Build Android APK

on:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and commit dependency lock
        run: |
          flutter create --no-pub --platforms=android --org com.yy675908 .
          flutter pub get
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock already up to date"
          else
            git commit -m "Lock Flutter dependencies"
            git push origin HEAD:agent/release-cleanup-0.9.28
          fi
