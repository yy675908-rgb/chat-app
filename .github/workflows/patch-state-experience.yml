name: Patch State Experience

on:
  push:
    branches: ["agent/deletion-memory-status-pass"]
    paths:
      - ".github/workflows/patch-state-experience.yml"
      - "tool/patch_state_experience.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deletion-memory-status-pass
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch state continuity and latency
        run: python3 tool/patch_state_experience.py
      - name: Format targeted Dart files
        run: dart format lib/screens/chat_screen.dart lib/screens/character_screen.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/chat_screen.dart lib/screens/character_screen.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Keep character state continuous and repair missing tags"
            git push origin HEAD:agent/deletion-memory-status-pass
          fi
