name: Apply Keyboard Focus Guard

on:
  push:
    branches: ["agent/keyboard-focus-guard"]
    paths:
      - "tool/apply_keyboard_focus_guard.py"
      - ".github/workflows/apply-keyboard-focus-guard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/keyboard-focus-guard
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Reset product source to main
        run: git checkout origin/main -- lib pubspec.yaml
      - name: Apply focus guard
        run: python3 tool/apply_keyboard_focus_guard.py
      - name: Format changed Dart files
        run: dart format lib/main.dart lib/screens/chat_screen.dart lib/screens/app_settings_screen.dart lib/screens/api_settings_screen.dart lib/screens/memory_screen.dart lib/screens/style_preferences_screen.dart lib/screens/character_screen.dart
      - name: Audit automatic focus
        run: |
          echo "Automatic focus calls:" 
          grep -R -n -E 'autofocus:[[:space:]]*true|requestFocus\(' lib || true
          if grep -R -q -E 'autofocus:[[:space:]]*true|requestFocus\(' lib; then exit 1; fi
          echo "Changed files:" 
          git diff --name-only origin/main -- lib pubspec.yaml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test/chat_message_test.dart test/chat_store_conversation_scope_test.dart test/settings_backup_test.dart
      - name: Test
        run: flutter test test/chat_message_test.dart test/chat_store_conversation_scope_test.dart test/settings_backup_test.dart
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add lib pubspec.yaml
          git commit -m "Prevent unintended keyboard focus restoration" || true
          git push origin HEAD:agent/keyboard-focus-guard
