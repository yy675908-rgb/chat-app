name: Apply Relationship Continuity Pass

on:
  push:
    branches: ["agent/relationship-continuity-pass"]
    paths:
      - "tool/apply_relationship_continuity.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/relationship-continuity-pass
          fetch-depth: 0

      - name: Apply relationship continuity changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/apply_relationship_continuity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Strengthen relationship memory and character continuity"
          git push origin HEAD:agent/relationship-continuity-pass
