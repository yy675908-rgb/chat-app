name: Apply Unified Mood

on:
  push:
    branches: ["agent/unify-mood-state"]
    paths:
      - "tool/apply_unified_mood.py"
      - ".github/workflows/apply-unified-mood.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-mood-state
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Reset product source to main
        run: git checkout origin/main -- lib pubspec.yaml
      - name: Apply unified mood patch
        run: python3 tool/apply_unified_mood.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test/chat_message_test.dart test/chat_store_conversation_scope_test.dart test/settings_backup_test.dart
      - name: Test
        run: flutter test test/chat_message_test.dart test/chat_store_conversation_scope_test.dart test/settings_backup_test.dart
      - name: Audit diff
        run: |
          git restore analysis_options.yaml pubspec.lock 2>/dev/null || true
          git diff --check
          git diff --name-only origin/main -- lib pubspec.yaml
          git diff --stat origin/main -- lib pubspec.yaml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/chat_screen.dart lib/screens/character_screen.dart pubspec.yaml
          git commit -m "Unify character state as mood" || true
          git push origin HEAD:agent/unify-mood-state
