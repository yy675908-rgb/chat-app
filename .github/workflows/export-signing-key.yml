name: Export signing key once

on:
  push:
    branches: [main]
    paths: [.github/workflows/export-signing-key.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: linjian-android-signing-v1
          fail-on-cache-miss: true

      - name: Verify signing key
        run: test -f /home/runner/.android/debug.keystore

      - name: Upload private signing key
        uses: actions/upload-artifact@v4
        with:
          name: linjian-signing-key-private
          path: /home/runner/.android/debug.keystore
          if-no-files-found: error
          retention-days: 1
