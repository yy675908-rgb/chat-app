name: Prepare Clean Release

on:
  push:
    branches: ["agent/clean-keyboard-release-final"]
    paths:
      - "tool/prepare_clean_release.py"
      - ".github/workflows/prepare-clean-release.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-keyboard-release-final
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply keyboard cleanup
        run: python3 tool/prepare_clean_release.py
      - name: Audit focus behavior
        run: |
          echo "Remaining automatic focus calls:"
          grep -R -n -E 'autofocus:[[:space:]]*true|requestFocus\(|requestFocus:[[:space:]]*true|showKeyboard' lib || true
          echo "Potential temporary/debug markers:"
          grep -R -n -E 'TODO|FIXME|TEMPORARY|debugPrint\(|print\(' lib || true
      - name: Format
        run: dart format lib
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit clean release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib pubspec.yaml
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Avoid automatic keyboard focus and prepare clean release"
            git push origin HEAD:agent/clean-keyboard-release-final
          fi
