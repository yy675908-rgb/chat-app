name: Run Final UX Polish

on:
  push:
    branches: ["agent/deletion-memory-status-pass"]
    paths:
      - "tool/apply_final_ux_polish.py"
      - ".github/workflows/run-final-ux-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deletion-memory-status-pass
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply polish
        run: python3 tool/apply_final_ux_polish.py
      - name: Format
        run: dart format lib/screens/chat_screen.dart lib/screens/character_screen.dart lib/widgets/message_bubble.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/chat_screen.dart lib/screens/character_screen.dart lib/widgets/message_bubble.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Polish conversation continuity and explicit style learning"
            git push origin HEAD:agent/deletion-memory-status-pass
          fi
