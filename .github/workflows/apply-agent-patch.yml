name: Apply Agent Patch

on:
  push:
    branches: ["agent/role-delete-intimacy"]
    paths:
      - "tool/apply_agent_changes.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/role-delete-intimacy
          fetch-depth: 0

      - name: Apply source rewrite and push
        shell: bash
        run: |
          set -euo pipefail
          script="tool/apply_agent_changes.py"
          if [ ! -f "$script" ]; then
            exit 0
          fi
          python3 "$script"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/chat_screen.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add character deletion and stronger intimacy behavior"
          git push origin HEAD:agent/role-delete-intimacy
