name: Apply Favorability Compact Actions

on:
  push:
    branches: ["agent/favorability-compact-actions"]
    paths:
      - "tool/apply_favorability_compact_actions.py"
      - ".github/workflows/apply-favorability-compact-actions.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/favorability-compact-actions
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Reset source to main
        run: git checkout origin/main -- lib pubspec.yaml
      - name: Apply patch
        run: python3 tool/apply_favorability_compact_actions.py
      - name: Audit semantics and diff
        run: |
          echo "Remaining user-facing intimacy wording:"
          grep -n "亲密度" lib/screens/chat_screen.dart || true
          echo "Automatic focus calls:"
          grep -R -n -E 'autofocus:[[:space:]]*true|requestFocus\(|requestFocus:[[:space:]]*true|showKeyboard' lib || true
          echo "Temporary/debug markers:"
          grep -R -n -E 'TODO|FIXME|TEMPORARY|debugPrint\(|print\(' lib || true
          echo "Diff against main:"
          git diff --stat origin/main -- lib/screens/chat_screen.dart lib/widgets/message_bubble.dart pubspec.yaml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test/chat_message_test.dart test/chat_store_conversation_scope_test.dart test/settings_backup_test.dart
      - name: Test
        run: flutter test test/chat_message_test.dart test/chat_store_conversation_scope_test.dart test/settings_backup_test.dart
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/chat_screen.dart lib/widgets/message_bubble.dart pubspec.yaml
          git commit -m "Treat intimacy as user favorability and compact message actions" || true
          git push origin HEAD:agent/favorability-compact-actions
