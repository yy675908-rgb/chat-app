name: Patch Deleted Character Summaries

on:
  push:
    branches: ["agent/deletion-memory-status-pass"]
    paths:
      - ".github/workflows/patch-delete-summary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deletion-memory-status-pass
      - name: Clear group summaries when a character is removed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/chat_screen.dart')
          text = p.read_text()
          old = """        final updated = conversation.copyWith(
                    participantIds: participantIds,
                    updatedAt: DateTime.now(),
                  );"""
          new = """        final updated = conversation.copyWith(
                    participantIds: participantIds,
                    branchSummaries: const {},
                    summarizedThroughMessageIds: const {},
                    updatedAt: DateTime.now(),
                  );"""
          if old not in text:
              raise SystemExit('group update anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/chat_screen.dart
          git commit -m "Clear retained group summaries for deleted characters"
          git push origin HEAD:agent/deletion-memory-status-pass
